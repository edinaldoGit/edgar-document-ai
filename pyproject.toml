[project]
name = "edgar-document-ai"
version = "0.1.0"
description = "Fine-grained multimodal RAG architecture for document intelligence and evidence-grounded question answering."
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "pymupdf>=1.28.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edgar"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
